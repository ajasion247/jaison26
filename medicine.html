<!DOCTYPE html>
<html>
<head>
    <title>Medicine List</title>
     <link rel="stylesheet" href="C:\Users\user\Desktop\PHARMACY PROJECT\css\medicine.css">
</head>
<body>

    <h2>Medicine Selection</h2>

    <form>

        <h3>Select Medicine Category (Radio Button)</h3>

        <input type="radio" id="tablet" name="category">
        <label for="tablet">Tablets</label><br>

        <input type="radio" id="syrup" name="category">
        <label for="syrup">Syrups</label><br>

        <input type="radio" id="capsule" name="category">
        <label for="capsule">Capsules</label><br>

        <input type="radio" id="injection" name="category">
        <label for="injection">Injections</label><br><br>


        <h3>Select Medicines (Checkboxes)</h3>

        <input type="checkbox" id="paracetamol">
        <label for="paracetamol">Paracetamol</label><br>

        <input type="checkbox" id="dolo650">
        <label for="dolo650">Dolo 650</label><br>

        <input type="checkbox" id="crocin">
        <label for="crocin">Crocin</label><br>

        <input type="checkbox" id="amoxicillin">
        <label for="amoxicillin">Amoxicillin</label><br>

        <input type="checkbox" id="azithromycin">
        <label for="azithromycin">Azithromycin</label><br>

        <input type="checkbox" id="cetirizine">
        <label for="cetirizine">Cetirizine</label><br>

        <input type="checkbox" id="metformin">
        <label for="metformin">Metformin</label><br>

        <input type="checkbox" id="insulin">
        <label for="insulin">Insulin</label><br>

        <input type="checkbox" id="pantoprazole">
        <label for="pantoprazole">Pantoprazole</label><br>

        <input type="checkbox" id="vitaminc">
        <label for="vitaminc">Vitamin C</label><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
